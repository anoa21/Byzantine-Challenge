<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byzantine Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#faf8fc;--card:#ffffff;--ink:#1d1b20;--mute:#5b5661;--accent:#4b2a7a;--accent-ink:#ffffff;--gold:#8a5f10;--line:#d9d2e3;--ok:#1f6b3a;--okbg:#e3f3e8;--bad:#a12a1f;--badbg:#fbe6e3;--sel:#ece4f7;color-scheme:light;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17141c;--card:#221e29;--ink:#efeaf5;--mute:#b4acbf;--accent:#b896ee;--accent-ink:#1b1022;--gold:#e0b45c;--line:#3e3749;--ok:#7fd69c;--okbg:#1c3325;--bad:#f2948a;--badbg:#3b1d1a;--sel:#33284a;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#17141c;--card:#221e29;--ink:#efeaf5;--mute:#b4acbf;--accent:#b896ee;--accent-ink:#1b1022;--gold:#e0b45c;--line:#3e3749;--ok:#7fd69c;--okbg:#1c3325;--bad:#f2948a;--badbg:#3b1d1a;--sel:#33284a;color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1,h2{font-family:'Source Serif 4',Georgia,serif;line-height:1.2;text-wrap:balance}
h1{font-size:2rem;margin:.2em 0}
h2{font-size:1.45rem;margin:.2em 0 .4em;color:var(--accent)}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:700;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label{font-weight:600}
input[type=text],select{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;max-width:100%}
select{width:100%}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.vers button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px}
.vers button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.progress{display:flex;gap:6px;margin:8px 0 0}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--accent)}
.mapwrap{position:relative;background:#ffffff;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.marker{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #3a2a55;background:#ffffff;color:#1d1b20;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.regbtn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
.regbtn .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.regbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.regbtn[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-ink)}
.regbtn.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.regbtn.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.marker.sel{background:#4b2a7a;color:#ffffff}
.marker.right{background:#1f6b3a;color:#fff;border-color:#1f6b3a}
.marker.wrong{background:#a12a1f;color:#fff;border-color:#a12a1f}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.qtext{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt input{margin-top:4px}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.hintbtn{background:transparent;border:0;color:var(--gold);font-weight:700;padding:6px 0;min-height:44px;text-decoration:underline}
.hint{color:var(--mute);font-style:italic}
.score{font-family:'Source Serif 4',Georgia,serif;font-size:3rem;font-weight:700;color:var(--accent)}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.legend{font-size:.9rem;color:var(--mute)}
.hidden{display:none}
</style>
</head>

const $=s=>document.querySelector(s);
function prog(){document.querySelectorAll('#prog span').forEach((e,i)=>e.classList.toggle('on',i<=S.round));}
function hintHTML(id,text){return S.version==='A'?`<button class="hintbtn" type="button" data-hint="${id}">Show hint</button><div class="hint hidden" id="h-${id}">${esc(text)}</div>`:'';}
function wireHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{const h=$('#h-'+b.dataset.hint);if(h.classList.contains('hidden')){h.classList.remove('hidden');S.hintsUsed++;b.remove();}});}
function mcHTML(id,q,options,correct,seed,hint){const order=shuffle(options.map((o,i)=>i),seed);return `<div class="q" id="q-${id}"><div class="qtext">${esc(q)}</div><div class="opts" role="radiogroup">${order.map(i=>`<label class="opt"><input type="radio" name="${id}" value="${i}"><span>${esc(options[i])}</span></label>`).join('')}</div>${hint?hintHTML(id,hint):''}<div class="fb hidden"></div></div>`;}
function readMC(id){const r=document.querySelector(`input[name="${id}"]:checked`);return r?Number(r.value):null;}
function showFB(id,ok,right){const box=$(`#q-${id} .fb`);box.classList.remove('hidden');box.classList.add(ok?'ok':'bad');box.textContent=ok?'Correct.':'Not quite. Answer: '+right;document.querySelectorAll(`#q-${id} input, #q-${id} select`).forEach(e=>e.disabled=true);}
function nextBtn(label){return `<div class="row" style="margin-top:16px"><button class="btn" id="go" type="button">${label}</button></div>`;}

function start(){S.round=0;prog();$('#screen').innerHTML=`<div class="card"><h2>Ready?</h2><p>Four rounds test what you learned today: the map, the people, the contributions, and how it all fits together. There are 27 points.</p>
<label for="nm">Your name</label><div class="row" style="margin:6px 0 14px"><input type="text" id="nm" autocomplete="off" style="flex:1 1 260px"></div>
<div style="font-weight:600">Choose the version your teacher gave you</div>
<div class="vers"><button type="button" data-v="A" aria-pressed="false"><b>Version A</b><br><span class="legend">Hint button on every question</span></button><button type="button" data-v="B" aria-pressed="false"><b>Version B</b><br><span class="legend">No hints, plus a bonus question each round</span></button></div>${nextBtn('Start Round 1')}</div>`;
const go=$('#go');const upd=()=>{go.disabled=!(S.version&&$('#nm').value.trim());};upd();
$('#nm').oninput=upd;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.version=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));upd();});
go.onclick=()=>{S.name=$('#nm').value.trim();round1();};}

function round1(){S.round=1;prog();S.mapSel={};
$('#screen').innerHTML=`<div class="card"><div class="eyebrow">Round 1 of 4 · Map · 10 points</div><h2>Justinian's empire in 565</h2><p>Select every region that was part of the Byzantine Empire when Justinian died in 565.</p>
<div class="mapwrap" id="mw">${MAP}${G.regions.map((r,i)=>`<span class="marker" id="mk-${i}" style="left:${r.x}%;top:${r.y}%" aria-hidden="true">${i+1}</span>`).join('')}</div>
<p class="legend">Find each number on the map, then tap its region below. Tap again to unselect.</p>
<div class="regions">${G.regions.map((r,i)=>`<button type="button" class="regbtn" data-i="${i}" aria-pressed="false"><span class="num">${i+1}</span><span class="lbl">${esc(r.name)}</span></button>`).join('')}</div>
${hintHTML('map',G.mapHint)}<div class="fb hidden" id="mapfb"></div>${nextBtn('Check my map')}</div>`;
wireHints();
document.querySelectorAll('.regbtn').forEach(b=>b.onclick=()=>{if(S.checked)return;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const mk=$('#mk-'+b.dataset.i);mk.classList.toggle('sel',on);});
S.checked=false;
$('#go').onclick=()=>{if(!S.checked){S.checked=true;let pts=0;document.querySelectorAll('.regbtn').forEach(b=>{const i=b.dataset.i;const r=G.regions[i];const sel=b.getAttribute('aria-pressed')==='true';const ok=sel===r.inEmpire;if(ok)pts++;b.classList.add(ok?'right':'wrong');b.disabled=true;b.querySelector('.lbl').textContent=(ok?'✓ ':'✗ ')+r.name+(r.inEmpire?': in the empire':': not in the empire');$('#mk-'+i).classList.add(ok?'right':'wrong');});
S.scores[0]=pts;const fb=$('#mapfb');fb.classList.remove('hidden');fb.classList.add(pts>=8?'ok':'bad');fb.textContent=`You classified ${pts} of 10 regions correctly. Green = right, red = wrong.`;$('#go').textContent='Go to Round 2';}else round2();};}

function selectQ(id,prompt,options,answer,hint,seed){const order=shuffle(options,seed);return `<div class="q" id="q-${id}"><div class="qtext">${esc(prompt)}</div><select id="s-${id}" aria-label="Your answer"><option value="">Choose...</option>${order.map(o=>`<option>${esc(o)}</option>`).join('')}</select>${hintHTML(id,hint)}<div class="fb hidden"></div></div>`;}

function round2(){S.round=2;prog();S.checked=false;const B=S.version==='B';
$('#screen').innerHTML=`<div class="card"><div class="eyebrow">Round 2 of 4 · Who am I? · 6 points</div><h2>Match each clue to a person</h2>${G.whoami.map((w,i)=>selectQ('w'+i,'"'+w.clue+'"',G.figures,w.answer,w.hint,11+i)).join('')}${B?mcHTML('wb',G.whoamiBonus.q,G.whoamiBonus.options,G.whoamiBonus.answer,7):''}${nextBtn('Check my answers')}</div>`;
wireHints();
$('#go').onclick=()=>{if(!S.checked){S.checked=true;let pts=0;G.whoami.forEach((w,i)=>{const ok=$('#s-w'+i).value===w.answer;if(ok)pts++;showFB('w'+i,ok,w.answer);});S.scores[1]=pts;
if(B){const ok=readMC('wb')===0;if(ok)S.bonus++;showFB('wb',ok,G.whoamiBonus.options[0]);}$('#go').textContent='Go to Round 3';window.scrollTo({top:0,behavior:'smooth'});}else round3();};}

function round3(){S.round=3;prog();S.checked=false;const B=S.version==='B';const legs=G.legacy.map(l=>l.answer);
$('#screen').innerHTML=`<div class="card"><div class="eyebrow">Round 3 of 4 · Then and now · 6 points</div><h2>Match each contribution to its legacy today</h2>${G.legacy.map((l,i)=>selectQ('l'+i,l.item,legs,l.answer,l.hint,31+i)).join('')}${B?mcHTML('lb',G.legacyBonus.q,G.legacyBonus.options,0,9):''}${nextBtn('Check my answers')}</div>`;
wireHints();
$('#go').onclick=()=>{if(!S.checked){S.checked=true;let pts=0;G.legacy.forEach((l,i)=>{const ok=$('#s-l'+i).value===l.answer;if(ok)pts++;showFB('l'+i,ok,l.answer);});S.scores[2]=pts;
if(B){const ok=readMC('lb')===0;if(ok)S.bonus++;showFB('lb',ok,G.legacyBonus.options[0]);}$('#go').textContent='Go to Round 4';window.scrollTo({top:0,behavior:'smooth'});}else round4();};}

function round4(){S.round=4;prog();S.checked=false;const B=S.version==='B';
$('#screen').innerHTML=`<div class="card"><div class="eyebrow">Round 4 of 4 · Apply it · 5 points</div><h2>What would happen?</h2>${G.apply.map((a,i)=>mcHTML('a'+i,a.q,a.options,a.answer,51+i,a.hint)).join('')}${B?mcHTML('ab',G.applyBonus.q,G.applyBonus.options,0,13):''}${nextBtn('Check my answers')}</div>`;
wireHints();
$('#go').onclick=()=>{if(!S.checked){S.checked=true;let pts=0;G.apply.forEach((a,i)=>{const ok=readMC('a'+i)===0;if(ok)pts++;showFB('a'+i,ok,a.options[0]);});S.scores[3]=pts;
if(B){const ok=readMC('ab')===0;if(ok)S.bonus++;showFB('ab',ok,G.applyBonus.options[0]);}$('#go').textContent='See my results';window.scrollTo({top:0,behavior:'smooth'});}else results();};}

function results(){S.round=5;prog();const t=S.scores.reduce((a,b)=>a+b,0);const pct=Math.round(t/27*100);
const msg=pct>=85?'Excellent. You know the Byzantine Empire well.':pct>=65?'Good work. Review the round with the lowest score.':'Keep going. Review your notes and station chart before tomorrow.';
const now=new Date();
$('#screen').innerHTML=`<div class="card"><div class="eyebrow">Results · show this screen to your teacher</div><h2>${esc(S.name)}</h2>
<div class="row" style="align-items:baseline"><div class="score">${t} / 27</div><div style="font-size:1.3rem;font-weight:700">${pct}%</div></div><p>${msg}</p>
<div class="tablewrap"><table><thead><tr><th>Round</th><th>What it measures</th><th class="n">Score</th></tr></thead><tbody>
<tr><td>1. Map</td><td>Locating the empire (SS.912.W.2.1)</td><td class="n">${S.scores[0]} / 10</td></tr>
<tr><td>2. Who am I?</td><td>Key figures (SS.912.W.2.4)</td><td class="n">${S.scores[1]} / 6</td></tr>
<tr><td>3. Then and now</td><td>Contributions (SS.912.W.2.5)</td><td class="n">${S.scores[2]} / 6</td></tr>
<tr><td>4. Apply it</td><td>Contributions (SS.912.W.2.5)</td><td class="n">${S.scores[3]} / 5</td></tr>
${S.version==='B'?`<tr><td>Bonus</td><td>Version B challenge</td><td class="n">${S.bonus} / 3</td></tr>`:`<tr><td>Hints used</td><td>Version A</td><td class="n">${S.hintsUsed}</td></tr>`}
</tbody></table></div>
<p class="legend">Version ${S.version} · ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</p>
<div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="again">Play again</button></div></div>`;
$('#again').onclick=()=>{S.version=null;S.scores=[0,0,0,0];S.bonus=0;S.hintsUsed=0;start();};window.scrollTo({top:0,behavior:'smooth'});}
start();
</script>
</body>
</html>
